<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Moved</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .turtle-wrapper {
            width: 280px;
            height: 280px;
            margin: 0 auto 2rem;
            position: relative;
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.15));
        }

        .turtle-svg {
            width: 100%;
            height: 100%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        .led-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 40%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 20px rgba(255,255,255,0.1);
        }

        p {
            color: #a0a0b0;
            font-size: 1.125rem;
            font-weight: 300;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="turtle-wrapper">
            <div class="led-glow"></div>
            <svg class="turtle-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
                    </linearGradient>
                </defs>
                
                <ellipse cx="100" cy="115" rx="55" ry="45" fill="url(#shellGrad)" filter="url(#softGlow)" opacity="0.9"/>
                
                <ellipse cx="100" cy="115" rx="40" ry="32" fill="none" stroke="#c0c0c0" stroke-width="1.5" opacity="0.5"/>
                <line x1="100" y1="83" x2="100" y2="147" stroke="#c0c0c0" stroke-width="1.5" opacity="0.5"/>
                <line x1="60" y1="115" x2="140" y2="115" stroke="#c0c0c0" stroke-width="1.5" opacity="0.5"/>
                <line x1="70" y1="95" x2="130" y2="135" stroke="#c0c0c0" stroke-width="1.5" opacity="0.5"/>
                <line x1="130" y1="95" x2="70" y2="135" stroke="#c0c0c0" stroke-width="1.5" opacity="0.5"/>
                
                <ellipse cx="100" cy="75" rx="25" ry="22" fill="url(#skinGrad)" filter="url(#softGlow)"/>
                
                <circle cx="90" cy="70" r="5" fill="#2a2a3e"/>
                <circle cx="110" cy="70" r="5" fill="#2a2a3e"/>
                <circle cx="91" cy="69" r="1.5" fill="#ffffff"/>
                <circle cx="111" cy="69" r="1.5" fill="#ffffff"/>
                
                <path d="M 85 82 Q 100 88 115 82" stroke="#2a2a3e" stroke-width="2" fill="none" stroke-linecap="round"/>
                
                <ellipse cx="75" cy="78" rx="8" ry="12" fill="url(#skinGrad)" transform="rotate(-20 75 78)" filter="url(#softGlow)"/>
                <ellipse cx="125" cy="78" rx="8" ry="12" fill="url(#skinGrad)" transform="rotate(20 125 78)" filter="url(#softGlow)"/>
                
                <ellipse cx="60" cy="130" rx="12" ry="8" fill="url(#skinGrad)" transform="rotate(-30 60 130)" filter="url(#softGlow)"/>
                <ellipse cx="140" cy="130" rx="12" ry="8" fill="url(#skinGrad)" transform="rotate(30 140 130)" filter="url(#softGlow)"/>
                <ellipse cx="70" cy="155" rx="10" ry="14" fill="url(#skinGrad)" transform="rotate(-10 70 155)" filter="url(#softGlow)"/>
                <ellipse cx="130" cy="155" rx="10" ry="14" fill="url(#skinGrad)" transform="rotate(10 130 155)" filter="url(#softGlow)"/>
                
                <path d="M 95 78 Q 100 75 105 78" stroke="#2a2a3e" stroke-width="1.5" fill="none" opacity="0.6"/>
                
                <ellipse cx="100" cy="65" rx="3" ry="2" fill="#d0d0d0" opacity="0.5"/>
            </svg>
        </div>
        
        <h1>Oops. This Website Has Been Moved</h1>
        <p>The page you are looking for has been relocated to a new address. Please check the URL or contact the administrator for assistance.</p>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
