<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault — by xso</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Clash+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0c0c0e;
  --bg2: #131316;
  --surface: #18181c;
  --surface2: #1f1f25;
  --border: #2a2a32;
  --border2: #353540;
  --accent: #6c63ff;
  --accent-soft: rgba(108,99,255,0.12);
  --accent2: #ff6584;
  --accent3: #43e97b;
  --text: #f0f0f4;
  --text2: #a0a0b0;
  --text3: #606070;
  --card: #111115;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 14px;
  --radius-sm: 8px;
}

[data-theme="light"] {
  --bg: #f5f5f7;
  --bg2: #ebebef;
  --surface: #ffffff;
  --surface2: #f0f0f4;
  --border: #dddde8;
  --border2: #c8c8d8;
  --text: #111118;
  --text2: #5a5a70;
  --text3: #9090a8;
  --card: #ffffff;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

svg.icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(12,12,14,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: background 0.3s, border-color 0.3s;
}

[data-theme="light"] header { background: rgba(245,245,247,0.88); }

.hdr {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 64px; gap: 1rem;
}

.logo {
  display: flex; align-items: center; gap: 0.6rem;
  text-decoration: none; color: var(--text);
}

.logo-mark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}

.logo-text {
  font-family: 'Instrument Serif', serif;
  font-size: 1.3rem;
  letter-spacing: -0.01em;
}

.logo-text span { color: var(--accent); font-style: italic; }

.hdr-right { display: flex; align-items: center; gap: 0.5rem; }

.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
}

.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.btn-outline {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.4rem 0.9rem;
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text2);
  cursor: pointer; text-decoration: none;
  transition: all 0.18s;
}

.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.hero {
  max-width: 1280px; margin: 0 auto;
  padding: 5rem 2rem 3rem;
  position: relative;
}

.hero-bg {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}

.hero-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
}

.hero-blob-1 { width: 500px; height: 500px; background: var(--accent); top: -100px; left: -100px; }
.hero-blob-2 { width: 400px; height: 400px; background: var(--accent2); top: 50px; right: -50px; }

.hero-inner { position: relative; z-index: 1; max-width: 680px; }

.hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: 'DM Mono', monospace; font-size: 0.65rem;
  color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase;
  padding: 0.3rem 0.8rem;
  border: 1px solid rgba(108,99,255,0.3);
  border-radius: 99px;
  background: var(--accent-soft);
  margin-bottom: 1.5rem;
}

.hero h1 {
  font-family: 'Instrument Serif', serif;
  font-size: clamp(3rem, 7vw, 5.5rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 1.2rem;
}

.hero h1 em {
  font-style: italic;
  background: linear-gradient(120deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-size: 1.05rem; color: var(--text2); line-height: 1.7;
  max-width: 460px; margin-bottom: 2.5rem;
}

.search-box {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.6rem 0.6rem 0.6rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 520px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-box input {
  flex: 1; border: none; background: transparent;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  outline: none;
}

.search-box input::placeholder { color: var(--text3); }

.search-box svg { color: var(--text3); flex-shrink: 0; }

.stats-row {
  display: flex; gap: 2.5rem; margin-top: 2.5rem; flex-wrap: wrap;
}

.stat { font-family: 'DM Mono', monospace; }
.stat-n { font-size: 1.8rem; font-weight: 500; color: var(--accent); line-height: 1; }
.stat-l { font-size: 0.62rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.2rem; }

.main {
  max-width: 1280px; margin: 0 auto;
  padding: 2rem 2rem 5rem;
  display: flex; gap: 1.75rem;
}

.sidebar { width: 200px; flex-shrink: 0; }

.sidebar-label {
  font-family: 'DM Mono', monospace; font-size: 0.6rem;
  color: var(--text3); text-transform: uppercase; letter-spacing: 0.15em;
  margin-bottom: 0.6rem; padding: 0 0.4rem;
}

.cat-list { display: flex; flex-direction: column; gap: 0.18rem; }

.cat-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
  cursor: pointer; transition: all 0.15s; text-align: left; width: 100%;
  gap: 0.5rem;
}

.cat-item:hover { background: var(--surface); color: var(--text); }

.cat-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(108,99,255,0.2);
}

.cat-item-left { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.cat-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cat-count {
  font-family: 'DM Mono', monospace; font-size: 0.6rem;
  background: var(--surface2); padding: 0.1rem 0.38rem; border-radius: 4px;
  color: var(--text3); flex-shrink: 0;
}

.cat-item.active .cat-count { background: rgba(108,99,255,0.18); color: var(--accent); }

.content { flex: 1; min-width: 0; }

.content-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem;
}

.content-title {
  font-size: 0.95rem; font-weight: 600;
  display: flex; align-items: center; gap: 0.5rem;
}

.content-count {
  font-family: 'DM Mono', monospace; font-size: 0.68rem;
  color: var(--text3); font-weight: 400;
}

.sort-select {
  font-family: 'DM Mono', monospace; font-size: 0.68rem;
  padding: 0.4rem 0.75rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text2); outline: none; cursor: pointer;
  transition: border-color 0.15s;
}

.sort-select:focus { border-color: var(--accent); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  position: relative; overflow: hidden;
  animation: fadeup 0.3s ease both;
}

@keyframes fadeup {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform: translateY(0); }
}

.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0; transition: opacity 0.25s;
}

.card:hover { transform: translateY(-3px); border-color: var(--border2); box-shadow: var(--shadow); }
.card:hover::before { opacity: 1; }

.card-cat-badge {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-family: 'DM Mono', monospace; font-size: 0.6rem;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 0.22rem 0.55rem; border-radius: 5px;
  margin-bottom: 0.75rem;
}

.card-title {
  font-size: 0.92rem; font-weight: 600; line-height: 1.45;
  margin-bottom: 0.5rem; color: var(--text);
}

.card-preview {
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  color: var(--text3); line-height: 1.65;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 1rem; padding-top: 0.85rem;
  border-top: 1px solid var(--border);
}

.copy-btn {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-family: 'DM Mono', monospace; font-size: 0.62rem;
  padding: 0.3rem 0.65rem;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); border-radius: 6px; cursor: pointer; transition: all 0.15s;
}

.copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.copy-btn.ok { background: var(--accent3); border-color: var(--accent3); color: #0a1a10; }

.card-date {
  font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--text3);
}

.empty {
  grid-column: 1/-1; text-align: center;
  padding: 5rem 1rem; color: var(--text3);
}

.empty-icon { margin-bottom: 1rem; opacity: 0.4; }
.empty p { font-size: 0.9rem; line-height: 1.7; }

.loader { grid-column: 1/-1; display: flex; justify-content: center; align-items: center; padding: 5rem; gap: 0.4rem; }
.dot { width: 7px; height: 7px; border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
.dot:nth-child(1) { background: var(--accent); }
.dot:nth-child(2) { background: var(--accent2); animation-delay: 0.2s; }
.dot:nth-child(3) { background: var(--accent3); animation-delay: 0.4s; }
@keyframes pulse { 0%,80%,100% { transform:scale(0.5); opacity:0.3; } 40% { transform:scale(1); opacity:1; } }

.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  opacity: 0; pointer-events: none; transition: opacity 0.22s;
}

.overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto;
  padding: 2rem;
  transform: translateY(16px) scale(0.98);
  transition: transform 0.22s;
}

.overlay.open .modal { transform: translateY(0) scale(1); }

.modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; gap: 1rem; }

.modal-badge {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-family: 'DM Mono', monospace; font-size: 0.6rem;
  text-transform: uppercase; letter-spacing: 0.1em;
  padding: 0.22rem 0.55rem; border-radius: 5px;
  margin-bottom: 0.5rem;
}

.modal-title {
  font-family: 'Instrument Serif', serif;
  font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.01em;
}

.close-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.close-btn:hover { color: var(--text); border-color: var(--border2); }

.modal-body {
  font-family: 'DM Mono', monospace; font-size: 0.78rem; line-height: 1.85;
  color: var(--text);
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 1.25rem;
  white-space: pre-wrap; word-break: break-word;
  max-height: 320px; overflow-y: auto;
  margin-bottom: 1.25rem;
}

.modal-copy {
  width: 100%; padding: 0.88rem;
  background: var(--accent); border: none; border-radius: 10px;
  color: #fff; font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
  transition: all 0.15s; letter-spacing: 0.01em;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}

.modal-copy:hover { background: #7d75ff; }
.modal-copy.ok { background: var(--accent3); color: #0a1a10; }

.toast {
  position: fixed; bottom: 1.75rem; left: 50%;
  transform: translateX(-50%) translateY(60px);
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); box-shadow: var(--shadow);
  font-family: 'DM Mono', monospace; font-size: 0.75rem;
  padding: 0.65rem 1.2rem; border-radius: 99px; z-index: 9000;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

.toast.show { transform: translateX(-50%) translateY(0); }

.footer {
  text-align: center; padding: 2rem;
  font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text3);
  border-top: 1px solid var(--border);
}

.footer a { color: var(--accent); text-decoration: none; }

@media (max-width: 768px) {
  .main { flex-direction: column; padding: 1rem 1rem 4rem; }
  .sidebar { width: 100%; }
  .cat-list { flex-direction: row; flex-wrap: wrap; }
  .cat-item { width: auto; }
  .hero { padding: 3rem 1rem 2rem; }
  .stats-row { gap: 1.5rem; }
  .hdr { padding: 0 1rem; }
}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <a href="index.html" class="logo">
      <div class="logo-mark">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <span class="logo-text">Prompt<span>Vault</span></span>
    </a>
    <div class="hdr-right">
      <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">
        <svg class="icon" id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <a href="admin.html" class="btn-outline">

</header>

<div class="hero">

    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
  </div>
  <div class="hero-inner">

        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      Koleksi Prompt AI by xso
    </div>

    <div class="search-box">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari prompt...">

    <div class="stats-row">
      <div class="stat"><div class="stat-n" id="statP">—</div><div class="stat-l">Total Prompt</div></div>

<div class="main">

<footer class="footer">
  crafted with care by <a href="#">xso</a>
</footer>

<div class="overlay" id="overlay">
  <div class="modal">

        <div class="modal-title" id="mTitle"></div>

      <button class="close-btn" onclick="closeModal()">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>

      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>

      Copy Prompt

<div class="toast" id="toast">
  <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>

  Prompt berhasil di-copy!
</div>

<script>
const SUPA_URL = 'https://ihykejeacueeitthgkze.supabase.co';
const SUPA_KEY = 'sb_publishable_W7N9zRqZlirQdLQvURiexA_Mj8Nvx5C';

const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);

const PALETTE = [
  { bg: 'rgba(108,99,255,0.12)', color: '#6c63ff' },
  { bg: 'rgba(255,101,132,0.12)', color: '#ff6584' },
  { bg: 'rgba(67,233,123,0.12)', color: '#2ec265' },
  { bg: 'rgba(255,184,0,0.12)', color: '#e0a800' },
  { bg: 'rgba(0,196,255,0.12)', color: '#00b8e0' },
  { bg: 'rgba(220,80,255,0.12)', color: '#c040e8' },
];

let cats = [], prompts = [], activeCat = 'all', query = '', sort = 'newest', curPrompt = null;

function getTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }

function toggleTheme() {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('pv-theme', next);
  updateThemeIcon(next);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  if (theme === 'light') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}

const savedTheme = localStorage.getItem('pv-theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

async function init() {
  const [{ data: c, error: ce }, { data: p, error: pe }] = await Promise.all([
    db.from('categories').select('*').order('name'),
    db.from('prompts').select('*, categories(name)').order('created_at', { ascending: false })
  ]);
  if (ce || pe) { showErr(); return; }
  cats = c || [];
  prompts = p || [];
  document.getElementById('statP').textContent = prompts.length;
  document.getElementById('statC').textContent = cats.length;
  renderCats();
  renderGrid();
}

function showErr() {
  document.getElementById('grid').innerHTML = '<div class="empty"><div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><p>Gagal konek ke database.<br>Pastiin config Supabase sudah benar.</p></div>';
}

function renderCats() {
  const el = document.getElementById('catList');
  let html = `<button class="cat-item ${activeCat==='all'?'active':''}" onclick="setCat('all')">
    <span class="cat-item-left">
      <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span class="cat-item-name">Semua</span>
    </span>
    <span class="cat-count">${prompts.length}</span>
  </button>`;
  cats.forEach(c => {
    const n = prompts.filter(p => p.category_id === c.id).length;
    html += `<button class="cat-item ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')">
      <span class="cat-item-left">
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        <span class="cat-item-name">${esc(c.name)}</span>
      </span>
      <span class="cat-count">${n}</span>
    </button>`;
  });
  el.innerHTML = html;
}

function renderGrid() {
  let data = [...prompts];
  if (activeCat !== 'all') data = data.filter(p => p.category_id === activeCat);
  if (query) { const q = query.toLowerCase(); data = data.filter(p => p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q)); }
  if (sort === 'oldest') data.sort((a,b) => new Date(a.created_at)-new Date(b.created_at));
  else if (sort === 'az') data.sort((a,b) => a.title.localeCompare(b.title));
  else data.sort((a,b) => new Date(b.created_at)-new Date(a.created_at));

  const lbl = activeCat === 'all' ? 'Semua Prompt' : (cats.find(c=>c.id===activeCat)?.name || '');
  document.getElementById('activeLabel').textContent = lbl;
  document.getElementById('countLabel').textContent = `(${data.length})`;

  const grid = document.getElementById('grid');
  if (!data.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p>Belum ada prompt di sini.<br>Tambahkan lewat admin panel.</p></div>`;
    return;
  }

  grid.innerHTML = data.map((p, i) => {
    const ci = cats.findIndex(c => c.id === p.category_id);
    const col = PALETTE[(ci >= 0 ? ci : i) % PALETTE.length];
    const catName = p.categories?.name || 'Uncategorized';
    const date = new Date(p.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
    return `<div class="card" onclick="openModal('${p.id}',${ci})">
      <div class="card-cat-badge" style="background:${col.bg};color:${col.color}">
        <svg class="icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        ${esc(catName)}
      </div>
      <div class="card-title">${esc(p.title)}</div>
      <div class="card-preview">${esc(p.content)}</div>
      <div class="card-footer">
        <button class="copy-btn" onclick="event.stopPropagation();quickCopy('${p.id}',this)">
          <svg class="icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
        <span class="card-date">${date}</span>
      </div>
    </div>`;
  }).join('');
}

function setCat(id) { activeCat = id; renderCats(); renderGrid(); }

function openModal(id, ci) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  curPrompt = p;
  const col = PALETTE[(ci >= 0 ? ci : 0) % PALETTE.length];
  const catName = p.categories?.name || 'Uncategorized';
  document.getElementById('mBadge').style.cssText = `background:${col.bg};color:${col.color}`;
  document.getElementById('mBadge').textContent = catName;
  document.getElementById('mTitle').textContent = p.title;
  document.getElementById('mBody').textContent = p.content;
  const btn = document.getElementById('mCopyBtn');
  btn.className = 'modal-copy';
  btn.innerHTML = '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Prompt';
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function copyModal() {
  if (!curPrompt) return;
  navigator.clipboard.writeText(curPrompt.content);
  const btn = document.getElementById('mCopyBtn');
  btn.className = 'modal-copy ok';
  btn.innerHTML = '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Tersalin!';
  showToast();
  setTimeout(() => {
    btn.className = 'modal-copy';
    btn.innerHTML = '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Prompt';
  }, 2200);
}

function quickCopy(id, btn) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  navigator.clipboard.writeText(p.content);
  btn.className = 'copy-btn ok';
  btn.innerHTML = '<svg class="icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
  showToast();
  setTimeout(() => {
    btn.className = 'copy-btn';
    btn.innerHTML = '<svg class="icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy';
  }, 2200);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('searchInput').addEventListener('input', e => { query = e.target.value; renderGrid(); });
document.getElementById('sortSel').addEventListener('change', e => { sort = e.target.value; renderGrid(); });
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
</body>
</html>
